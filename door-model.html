<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>방문 모델 — Blender MCP</title>
<style>
body{margin:0;overflow:hidden;font:14px/1.6 system-ui,sans-serif;color:#292929}
#info{position:absolute;top:16px;left:16px;right:16px;z-index:2;background:#fffffff0;padding:14px 18px;border:1px solid #ddd;border-radius:6px}
button,a{font:inherit;margin-right:12px;color:#315f82}button{background:#f1f3f5;border:1px solid #ccc;padding:5px 12px;border-radius:4px;cursor:pointer}#status{color:#555}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="info"><b>방문 모델 · Blender MCP</b><br>폭 0.9m × 높이 2m × 두께 0.04m. 실측 전 가정값입니다. 드래그로 돌려 보세요.<br>
<button id="toggle" disabled>문 열기 / 닫기</button><a href="assets/room-door.glb" download>GLB 다운로드</a><a href="index.html">과제 목록</a><span id="status">모델 불러오는 중</span></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xe9e9e6);
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.02,30); camera.position.set(2.1,1.8,3.6);
const controls = new OrbitControls(camera,renderer.domElement); controls.target.set(0,1.05,0); controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x777066,2));
const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(3,5,4);scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,1);fill.position.set(-3,2,-3);scene.add(fill);
const grid=new THREE.GridHelper(4,16,0xa6a6a0,0xcecec8);grid.position.y=-0.002;scene.add(grid);
let door=null,open=false;
new GLTFLoader().load('assets/room-door.glb',gltf=>{
  door=gltf.scene;door.position.x=-0.45;scene.add(door);
  document.getElementById('status').textContent='GLB 불러오기 완료';document.getElementById('toggle').disabled=false;
},undefined,error=>{document.getElementById('status').textContent='모델을 열지 못했습니다. 새로고침해 주세요.';console.error(error);});
document.getElementById('toggle').addEventListener('click',()=>{open=!open;if(door)door.rotation.y=THREE.MathUtils.degToRad(open?80:0);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></body></html>
