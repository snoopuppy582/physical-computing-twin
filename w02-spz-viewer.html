<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2주차 예제 D — 내 스캔 파일(SPZ/PLY) 확인하기</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#101418; font-family: system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  #안내 { position:fixed; left:0; right:0; top:0; z-index:10; background:rgba(20,24,32,.85); color:#fff; padding:10px 14px; font-size:14px; line-height:1.5; }
  #안내 b { color:#7fd1ff; }
  #드롭 { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; width:min(560px, 80vw); padding:28px 24px; text-align:center;
    color:#eef2f8; background:rgba(20,24,32,.9); border:2px dashed #7fd1ff; border-radius:16px; font-size:16px; line-height:1.6; }
  #드롭.over { background:rgba(47,111,237,.35); }
  #드롭 input { display:block; margin:12px auto 0; color:#9fb0c6; }
  #정보 { position:fixed; left:14px; top:72px; z-index:10; width:290px; background:rgba(20,24,32,.9); color:#eef2f8; border:1px solid #2e3849; border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.6; display:none; }
  #정보 b { color:#7fd1ff; } #정보 .warn { color:#ffd166; font-weight:700; } #정보 .ok { color:#37d67a; font-weight:700; }
  button { font:inherit; font-size:13px; font-weight:700; padding:7px 10px; border:0; border-radius:8px; background:#3a4657; color:#fff; cursor:pointer; margin:6px 4px 0 0; }
  code { background:#0e1219; padding:1px 5px; border-radius:5px; font-size:12px; }
</style>
</head>
<body>
<div id="안내">
  <b>2주차 예제 D</b> — Scaniverse에서 내보낸 <b>SPZ(또는 PLY)</b> 파일을 여기에 끌어다 놓으면 노트북 브라우저에서 바로 볼 수 있습니다.
  스플랫 개수와 파일 크기를 확인하세요. 👉 3주차에는 이 파일을 SuperSplat에서 정리한 뒤 <code>assets/room.spz</code>로 씁니다.
</div>
<div id="드롭">
  여기에 <b>.spz / .ply</b> 파일을 끌어다 놓으세요<br><small>또는 파일 선택</small>
  <input type="file" id="파일" accept=".spz,.ply,.splat,.ksplat">
  <div style="margin-top:10px"><button id="샘플">샘플 스플랫 열어 보기 (Spark 나비)</button></div>
</div>
<div id="정보">
  <b>파일</b> <span id="이름">–</span><br>
  <b>크기</b> <span id="크기">–</span> <span id="크기판정"></span><br>
  <b>스플랫 개수</b> <span id="개수">–</span> <span id="개수판정"></span><br>
  <b>범위(m)</b> <span id="범위">–</span><br>
  <button id="뒤집기">위아래 뒤집기</button><button id="다시">다른 파일</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.1.0/dist/spark.module.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 200); camera.position.set(2.5, 1.6, 3.5);
const renderer = new THREE.WebGLRenderer({ antialias: false }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.8, 0);
scene.add(new SparkRenderer({ renderer }));
scene.add(new THREE.GridHelper(10, 20, 0x334455, 0x223344));
let 스플랫 = null;

function 보이기(mesh, name, bytes) {
  if (스플랫) { scene.remove(스플랫); 스플랫.dispose?.(); }
  스플랫 = mesh; 스플랫.quaternion.set(1, 0, 0, 0);   // Scaniverse/SuperSplat 파일은 대개 Y축이 아래 → 뒤집어 세움
  scene.add(스플랫);
  $('드롭').style.display = 'none'; $('정보').style.display = 'block';
  $('이름').textContent = name;
  const mb = bytes / 1048576; $('크기').textContent = mb.toFixed(1) + ' MB';
  $('크기판정').innerHTML = mb > 100 ? '<span class="warn">100 MB 초과 — GitHub Pages 불가. SuperSplat에서 잘라내기</span>' : mb > 50 ? '<span class="warn">큰 편 — 3주차에 정리</span>' : '<span class="ok">OK</span>';
}
function 통계(mesh) {
  const n = mesh.numSplats ?? 0; $('개수').textContent = n.toLocaleString();
  $('개수판정').innerHTML = n > 1500000 ? '<span class="warn">150만 초과 — 노트북에서 느릴 수 있음</span>' : n > 0 ? '<span class="ok">OK</span>' : '';
  try { const b = mesh.getBoundingBox(); const s = new THREE.Vector3(); b.getSize(s); $('범위').textContent = `${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)}`;
    const c = new THREE.Vector3(); b.getCenter(c); controls.target.set(c.x, -c.y, -c.z); camera.position.set(c.x + s.length() * 0.6, -c.y + s.y * 0.5, -c.z + s.length() * 0.6); } catch (e) {}
}
async function 파일열기(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const mesh = new SplatMesh({ fileBytes: bytes, fileName: file.name, onLoad: m => 통계(m) });
  보이기(mesh, file.name, file.size);
}
const 드롭 = $('드롭');
['dragenter', 'dragover'].forEach(ev => addEventListener(ev, e => { e.preventDefault(); 드롭.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => addEventListener(ev, e => { e.preventDefault(); 드롭.classList.remove('over'); }));
addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) 파일열기(f); });
$('파일').addEventListener('change', e => { const f = e.target.files[0]; if (f) 파일열기(f); });
$('샘플').addEventListener('click', async () => {
  const url = 'https://sparkjs.dev/assets/splats/butterfly.spz';
  const res = await fetch(url); const buf = await res.arrayBuffer();
  const mesh = new SplatMesh({ fileBytes: new Uint8Array(buf), fileName: 'butterfly.spz', onLoad: m => 통계(m) });
  보이기(mesh, 'butterfly.spz (샘플)', buf.byteLength);
});
$('뒤집기').addEventListener('click', () => { if (스플랫) 스플랫.rotateX(Math.PI); });
$('다시').addEventListener('click', () => { $('드롭').style.display = 'block'; $('정보').style.display = 'none'; });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
